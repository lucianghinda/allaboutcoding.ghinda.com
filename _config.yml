destination: _site

title: All about coding
tagline: Ruby and Rails technical content written by Lucian Ghinda
description: Ruby and Rails technical content written by Lucian Ghinda.
url: https://allaboutcoding.ghinda.com
baseurl: ""
lang: en-US

# Root-level article slugs, matching the existing Hashnode URLs (e.g. /how-to-learn-ruby/).
# GitHub Pages 301-redirects the no-trailing-slash form to this, preserving inbound links.
permalink: /:title/

excerpt_separator: <!--more-->

# Newsletter invite, rendered by _includes/newsletter_invite.html on the home
# page and after every article. It lives here rather than in the template so
# switching provider or endpoint is a config change.
#
# `action` is a plain GET to the beehiiv subscribe page: the address travels as
# ?email=..., beehiiv prefills its own form, and the reader confirms there. That
# keeps the site JavaScript-free and avoids an iframe that cannot follow the
# dark theme. beehiiv uses double opt-in, so a direct POST would not save the
# reader a confirmation step anyway.
#
# To subscribe in one step instead, take the embed URL from beehiiv
# (Dashboard -> Grow -> Subscribe Forms -> Embed) and set:
#   action: https://embeds.beehiiv.com/<uuid>
#   method: post
newsletter:
  name: Field Notes
  description: >-
    A personal newsletter with ideas on Ruby, software development, testing,
    building products and workshops, plus notes on creativity and tech trends.
  url: https://newsletter.lucianghinda.com
  action: https://newsletter.lucianghinda.com/subscribe
  method: get
  cadence: one email a week

# crbelaus/jekyll-tailwind: compile _tailwind.css -> _site/assets/css/styles.css
# (the <link> in _layouts/default.html points at /assets/css/styles.css)
tailwind:
  input: "_tailwind.css"
  output: "_site/assets/css/styles.css"
  minify: true

pagination:
  enabled: true
  per_page: 10
  sort_reverse: true
  trail:
    before: 3
    after: 3

tag_page_layout: tag_page
tag_page_dir: tags

# toshimaru/jekyll-toc. Opt-in per post with `toc: true` in the front matter.
# h2 only: the post title is already the page's single h1, and listing h3
# subsections made the TOC as long as an outline instead of a quick map.
# Styling lives in _layouts/post.html, not here — Tailwind scans source files
# for class names and would not see classes emitted from this config.
toc:
  min_level: 2
  max_level: 2
  ordered_list: true

# lucianghinda/jekyll-agent-markdown: writes raw Markdown siblings for posts and
# Markdown-backed pages, then indexes them in /llms.txt. Explicit settings make a
# missing `url:` fail the build loudly instead of silently skipping llms.txt.
# Opt a document out with `agent_markdown: false` in its front matter.
agent_markdown:
  posts: true
  pages: true
  llms_txt: true
  sort: desc
  include_dates: true

# jekyll-seo-tag configuration
author: Lucian Ghinda
logo: /assets/images/home-blog-card.png
twitter:
  username: lucianghinda
  card: summary_large_image
social:
  name: Lucian Ghinda
  links:
    - https://twitter.com/lucianghinda
    - https://ruby.social/@lucian
    - https://github.com/lucianghinda
    - https://hashnode.com/@lucianghinda

google_site_verification:

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - README.md
  - bin
  - LICENSE
  - _tailwind.css
  - vendor
  - .bundle
